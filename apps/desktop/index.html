<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Loopback-only by default: the app must work with no internet at all.
      The API port is a wildcard because it is configurable (VG_PORT); the
      host stays pinned to loopback.

      The one exception is img-src for OpenStreetMap tiles, reached only when
      no offline tile pack is installed. Images only -- not script, not fetch
      -- so map imagery can never become a code-execution path. A field device
      should carry a tile pack and never hit this fallback.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: https://tile.openstreetmap.org https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org"
    />
    <title>ViksitGaanw</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Loopback-only by default: the app must work with no internet at all.
      The API port is a wildcard because it is configurable (VG_PORT); the
      host stays pinned to loopback.

      The one exception is img-src for OpenStreetMap tiles, reached only when
      no offline tile pack is installed. Images only -- not script, not fetch
      -- so map imagery can never become a code-execution path. A field device
      should carry a tile pack and never hit this fallback.

      Profile photos and machine pictures are served by the local API, so
      img-src also allows loopback.

      Videos are the other exception, and only play when someone presses
      play: YouTube in an embed frame (frame-src, with its thumbnails in
      img-src), and Mux streamed with hls.js (its playlists and segments in
      connect-src and media-src, hls.js's worker from a blob). No video host
      may run script in this page.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:* https://stream.mux.com https://*.mux.com; img-src 'self' data: http://127.0.0.1:* http://localhost:* https://tile.openstreetmap.org https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://i.ytimg.com https://image.mux.com; frame-src https://www.youtube-nocookie.com; media-src 'self' blob: https://stream.mux.com https://*.mux.com; worker-src 'self' blob:"
    />
    <title>ViksitGaanw</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
